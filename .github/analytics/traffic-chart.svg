<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="auto">
  <defs>
    <style>
      .title { font: 600 15px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; fill: #1e293b; }
      .subtitle { font: 400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; fill: #64748b; }
      .legend-text { font: 500 12px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="760" height="280" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Chart Header -->
  <text x="24" y="32" class="title">Daily Traffic Trends (Rolling 5-Day Window)</text>
  <text x="24" y="48" class="subtitle">Official GitHub Traffic API (UTC 24h Buckets)</text>

  <!-- Legend -->
  <g transform="translate(520, 24)">
    <rect x="0" y="2" width="12" height="12" rx="2" fill="#2563eb"/>
    <text x="18" y="12" class="legend-text">Page Views</text>
    <rect x="105" y="2" width="12" height="12" rx="2" fill="#8b5cf6"/>
    <text x="123" y="12" class="legend-text">Git Clones</text>
  </g>

  <!-- Grid & Axes -->
  <g>
    <line x1="60" y1="230.0" x2="730" y2="230.0" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/><text x="50" y="234.0" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" fill="#64748b" text-anchor="end">0</text><line x1="60" y1="145.0" x2="730" y2="145.0" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/><text x="50" y="149.0" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" fill="#64748b" text-anchor="end">2.5</text><line x1="60" y1="60.0" x2="730" y2="60.0" stroke="#e2e8f0" stroke-dasharray="4" stroke-width="1"/><text x="50" y="64.0" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" fill="#64748b" text-anchor="end">5</text>
    <!-- Base Axis -->
    <line x1="60" y1="230" x2="730" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Bars & Labels -->
  <g>
    
    <text x="380.0" y="145.0" text-anchor="middle" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" fill="#94a3b8">Awaiting initial traffic data points from GitHub API</text>
  </g>
</svg>
